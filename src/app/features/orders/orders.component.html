<div class="container-fluid p-3 orders-page">
  <header class="orders-header d-flex align-items-center justify-content-between mb-3 px-3 py-2 bg-body border rounded-4 shadow-sm">
    <div class="d-flex align-items-center gap-3">
      @if (!isMobilePortrait) {
        <button
          type="button"
          class="btn btn-link p-0 fullscreen-btn"
          (click)="toggleFullscreen()"
          [attr.aria-label]="isFullscreen ? 'Salir de pantalla completa' : 'Pantalla completa'"
          [title]="isFullscreen ? 'Salir de pantalla completa' : 'Pantalla completa'"
        >
          @if (!isFullscreen) {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true" focusable="false">
              <path d="M168 32L24 32C10.7 32 0 42.7 0 56L0 200c0 9.7 5.8 18.5 14.8 22.2S34.1 223.8 41 217l40-40 79 79-79 79-40-40c-6.9-6.9-17.2-8.9-26.2-5.2S0 302.3 0 312L0 456c0 13.3 10.7 24 24 24l144 0c9.7 0 18.5-5.8 22.2-14.8s1.7-19.3-5.2-26.2l-40-40 79-79 79 79-40 40c-6.9 6.9-8.9 17.2-5.2 26.2S270.3 480 280 480l144 0c13.3 0 24-10.7 24-24l0-144c0-9.7-5.8-18.5-14.8-22.2s-19.3-1.7-26.2 5.2l-40 40-79-79 79-79 40 40c6.9 6.9 17.2 8.9 26.2 5.2S448 209.7 448 200l0-144c0-13.3-10.7-24-24-24L280 32c-9.7 0-18.5 5.8-22.2 14.8S256.2 66.1 263 73l40 40-79 79-79-79 40-40c6.9-6.9 8.9-17.2 5.2-26.2S177.7 32 168 32z"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
              <path d="M456 224l-144 0c-13.3 0-24-10.7-24-24l0-144c0-9.7 5.8-18.5 14.8-22.2S322.1 32.2 329 39l40 40 73.4-73.4C446 2 450.9 0 456 0s10 2 13.7 5.7l36.7 36.7C510 46 512 50.9 512 56s-2 10-5.7 13.7L433 143 473 183c6.9 6.9 8.9 17.2 5.2 26.2S465.7 224 456 224zm0 64c9.7 0 18.5 5.8 22.2 14.8s1.7 19.3-5.2 26.2l-40 40 73.4 73.4c3.6 3.6 5.7 8.5 5.7 13.7s-2 10-5.7 13.7l-36.7 36.7C466 510 461.1 512 456 512s-10-2-13.7-5.7L369 433 329 473c-6.9 6.9-17.2 8.9-26.2 5.2S288 465.7 288 456l0-144c0-13.3 10.7-24 24-24l144 0zm-256 0c13.3 0 24 10.7 24 24l0 144c0 9.7-5.8 18.5-14.8 22.2s-19.3 1.7-26.2-5.2l-40-40-73.4 73.4C66 510 61.1 512 56 512s-10-2-13.7-5.7L5.7 469.7C2 466 0 461.1 0 456s2-10 5.7-13.7L79 369 39 329c-6.9-6.9-8.9-17.2-5.2-26.2S46.3 288 56 288l144 0zM56 224c-9.7 0-18.5-5.8-22.2-14.8S32.2 189.9 39 183L79 143 5.7 69.7C2 66 0 61.1 0 56S2 46 5.7 42.3L42.3 5.7C46 2 50.9 0 56 0S66 2 69.7 5.7L143 79 183 39c6.9-6.9 17.2-8.9 26.2-5.2S224 46.3 224 56l0 144c0 13.3-10.7 24-24 24L56 224z"/>
            </svg>
          }
        </button>
      }
      <div>
        <p class="orders-eyebrow mb-1">Backoffice</p>
        <h1 class="orders-title mb-0">Nuevo pedido</h1>
      </div>
    </div>

    <div class="user-menu-wrapper position-relative" (mouseleave)="closeUserMenu()">
      <button
        type="button"
        class="btn user-menu-trigger d-flex align-items-center gap-2"
        (click)="toggleUserMenu()"
        aria-haspopup="menu"
        [attr.aria-expanded]="isUserMenuOpen"
      >
        <span class="user-avatar">LD</span>
        <span class="user-name">{{ (username$ | async) || 'Usuario' }}</span>
      </button>

      <div class="user-dropdown card shadow-sm" *ngIf="isUserMenuOpen" role="menu">
        <button type="button" class="dropdown-item" (click)="logout()">Salir</button>
      </div>
    </div>
  </header>

  <div class="row g-3 orders-row align-items-stretch">
    <div class="col-12 col-xl-8 col-lg-7 d-flex flex-column h-100 p-0 products-column">
      <app-top-bar
        class="sticky-top"
        [isVoiceMode]="isVoiceOrderActive"
        [isBarcodeMode]="isBarcodeScannerActive"
        [layoutMode]="layoutMode"
        [sortMode]="sortMode"
        (searchChange)="onSearchChange($event)"
        (categoriesChange)="onCategoriesChange($event)"
        (sortModeChange)="onSortModeChange($event)"
        (layoutButtonPress)="onLayoutButtonPress()"
        (selectionModeSelect)="selectManualMode()"
        (voiceModeSelect)="selectVoiceOrderView()"
        (barcodeModeSelect)="selectBarcodeScannerView()"
        (unregisteredItemRequest)="openUnregisteredItemModal()"
      ></app-top-bar>
      <div class="flex-grow-1 overflow-auto p-2 products-scroll" [class.panel-mode]="isVoiceOrderActive || isBarcodeScannerActive">
        @if (isVoiceOrderActive) {
          <div class="voice-mode-panel h-100 w-100">
            <ng-container *ngComponentOutlet="voiceOrderPanelComponent"></ng-container>
          </div>
        } @else if (isBarcodeScannerActive) {
          <div class="barcode-mode-panel h-100 w-100">
            <ng-container *ngComponentOutlet="barcodeScannerPanelComponent"></ng-container>
          </div>
        } @else {
          <div class="catalog-panel">
            <app-product-list
              [searchTerm]="searchTerm"
              [selectedCategories]="selectedCategories"
              [layoutMode]="layoutMode"
              [sortMode]="sortMode"
            ></app-product-list>
          </div>
        }
      </div>
    </div>

    <div class="col-12 col-xl-4 col-lg-5 d-flex flex-column h-100 p-0 summary-column">
      @if (!isMobilePortrait) {
        <app-order-summary></app-order-summary>
      }
    </div>
  </div>

  @if (isMobilePortrait) {
    <button type="button" class="mobile-summary-band" (click)="toggleSummarySheet()">
      @if (itemsCount$ | async; as itemsCount) {
        @if (orderTotal$ | async; as orderTotal) {
          <span>{{ itemsCount }} ítems = {{ orderTotal | currency: 'USD':'symbol':'1.2-2' }}</span>
        }
      } @else {
        <span>No hay productos</span>
      }
      <span class="mobile-summary-chevron" aria-hidden="true">{{ isSummarySheetOpen ? '⌄' : '›' }}</span>
    </button>

    @if (isSummarySheetOpen) {
      <button type="button" class="mobile-summary-backdrop" aria-label="Cerrar resumen" (click)="closeSummarySheet()"></button>
      <div class="mobile-summary-sheet" role="dialog" aria-label="Resumen del pedido">
        <app-order-summary></app-order-summary>
      </div>
    }
  }

  <app-unregistered-item-modal
    [isOpen]="isUnregisteredItemModalOpen"
    (closeModal)="closeUnregisteredItemModal()"
    (addItem)="addUnregisteredItem($event)"
  ></app-unregistered-item-modal>
</div>
