<div class="container-fluid d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-sm border-0 login-card">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-1 fw-bold">Comanda POS</h1>
      <p class="text-muted mb-4">Ingresá para comenzar a vender</p>

      <form (ngSubmit)="submit()" class="d-flex flex-column gap-3">
        <div>
          <label class="form-label fw-semibold" for="username">Usuario</label>
          <input
            id="username"
            name="username"
            class="form-control form-control-lg"
            type="text"
            [(ngModel)]="username"
            required
          />
        </div>

        <div>
          <label class="form-label fw-semibold" for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            class="form-control form-control-lg"
            type="password"
            [(ngModel)]="password"
            required
          />
        </div>

        @if (loginError) {
          <div class="alert alert-danger py-2 mb-0" role="alert">
            Credenciales inválidas. Probá con cualquier usuario y contraseña 1234.
          </div>
        }

        <button
          class="btn btn-primary-custom btn-lg mt-2"
          type="submit"
          [disabled]="loading || !username || !password"
        >
          @if (loading) {
            Ingresando...
          } @else {
            Ingresar
          }
        </button>
      </form>
    </div>
  </div>
</div>
